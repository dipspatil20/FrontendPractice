<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <form action=""> <!--novalidate-->

        <input type="text" placeholder="Username" autofocus><br>
        <input type="text" placeholder="required field" required><br>
        <input type="text" disabled placeholder="disabled field"><br>
        <input type="text" size="30" placeholder="size of textfield"><br>
        <input type="text" maxlength="10" minlength="10" placeholder="minlength & maxlength"><br>
        <input type="number" placeholder="Age" max="30" min="18" step="4"><br>
        <input type="date" max="2026-09-28" min="2026-09-05"><br>
        <input type="file" accept=".jpg, .png">
        <br><br>

        <input type="text" pattern="[A-Da-z0-9@#$]{7}" placeholder="pattern matching">


        <button>Submit</button>

    </form>
</body>
</html>
