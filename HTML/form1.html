<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="">
        <fieldset style="width: 400px; text-align: center;">
            <legend><h3>Application Form</h3></legend>
            <h3>Date Attribute</h3>

        <label for="">Date of Birth: </label>
        <input type="date"> <br><br>
        <input type="datetime" name="" id=""> 
        <input type="datetime-local"> 
        <input type="month" name="" id=""><br><br>
        <input type="time" name="" id="">
        <input type="week" name="" id="">

        <br><br>
        <h3>Radio </h3>
        <label for="">Gender: </label>
        <input type="radio" name="Gender" value="Female">Female
        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Other">Other <br><br>

        <h3>checkbox</h3>
        <label for="">Languages</label>
        <input type="checkbox" name="lang" value="MH">Marathi
        <input type="checkbox" name="lang" value="HI">Hindi
        <input type="checkbox" name="lang" value="GJ">Gujarati
        <input type="checkbox" name="lang" value="ENG">English <br><br>

        <h3>Option</h3>
        <label for="">City: </label>
        <select name="" id="">
            <option value="">Vapi</option>
            <option value="">Pune</option>
            <option value="">Amalner</option>
        </select>

        <h3>Option group</h3>
        <label for="">Choose City: </label>
        <select name="" id="">
            <optgroup label="States">
                <option value="">Maharashtra</option>
                <option value="">Gujarat</option>
                <option value="">Karnataka</option>
            </optgroup>
            <optgroup label="cities"> <!--act as attribute and tag-->
                <option value="">Mumbai</option>
                <option value="">Vapi</option>
                <option value="">Hydrabad</option>
            </optgroup>
        </select>

        <label for="">color</label>
        <input type="color" name="" id=""> <br><br>

        <label for="">Select File: </label>
        <input type="file" name="" id=""> <br><br>

        <label for=""></label>
        <input type="range" name="" id=""> <br><br>

        <label for="">Seach Bar: </label>
        <input type="search" name="" id="">
        


        <br><br>
        <button>Submit</button>
        </fieldset>

    </form>


</body>
</html>
